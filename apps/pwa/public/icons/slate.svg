<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SLATE">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131622"/>
      <stop offset="1" stop-color="#08090f"/>
    </linearGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8f2f8"/>
      <stop offset="1" stop-color="#3fd0dd"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>

  <!--
    A marca é uma superfície de controle vista em perspectiva: uma grade de
    células, uma delas acesa. É o produto reduzido ao essencial — muitos
    controles, um em foco — e continua legível em 48px, onde um desenho mais
    detalhado viraria borrão.
  -->
  <g transform="translate(256 256)">
    <g transform="skewY(-14)">
      <rect x="-132" y="-96" width="112" height="80" rx="18" fill="url(#marca)" opacity="0.28"/>
      <rect x="4" y="-96" width="112" height="80" rx="18" fill="url(#marca)" opacity="0.28"/>
      <rect x="-132" y="24" width="112" height="80" rx="18" fill="url(#marca)" opacity="0.28"/>
      <rect x="4" y="24" width="112" height="80" rx="18" fill="url(#marca)"/>
    </g>
  </g>
</svg>
