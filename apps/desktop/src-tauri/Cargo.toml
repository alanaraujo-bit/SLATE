[package]
name = "slate-agente"
version = "0.1.7"
description = "Agente do SLATE para Windows"
authors = ["Aionixdev"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "slate_agente_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cliente HTTP com armazenamento de cookies próprio do processo.
#
# O Agente autentica na conta como qualquer cliente, mas não é um navegador: o
# cookie de sessão vive aqui, fora do alcance da interface. Isso evita toda a
# discussão de origem e SameSite que existe do lado da PWA.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "rustls-tls",
] }

# O armazenamento de cookies embutido no reqwest só existe em memória: fechar o
# Agente apagava a sessão e obrigava a entrar de novo a cada abertura. Estes
# dois pacotes expõem o mesmo armazenamento em forma serializável, que o
# `api.rs` grava em disco protegido por DPAPI.
#
# A versão está presa em 0.9 de propósito: a 0.10 implementa o trait de cookies
# do reqwest 0.13, e com o reqwest 0.12 daqui o `cookie_provider` não compila.
# Subir uma exige subir a outra.
reqwest_cookie_store = "0.9"
cookie_store = { version = "0.22", features = ["serde_json"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

# Transporte em tempo real. `webrtc` fornece a pilha completa (ICE, TURN,
# DTLS, SCTP e DataChannel); usar `str0m` exigiria implementar descoberta de
# interfaces e TURN fora da biblioteca, justamente as partes críticas do P1-M5.
webrtc = "0.20.2"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
local-ip-address = "0.6.13"
uuid = { version = "1", features = ["v4", "serde"] }

# Identidade do dispositivo.
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
base64 = "0.22"

thiserror = "2"

# Seletor de arquivo nativo. Escolher o executável é um ato do computador, não
# do celular: é o que mantém a promessa do ADR-0004 de que nenhum caminho de
# arquivo chega pelo canal.
tauri-plugin-dialog = "2.7.2"

# Codifica o ícone extraído do próprio `.exe`. Sem isto o atalho de um jogo
# viraria um quadrado genérico, e é justamente o ícone que faz o painel parecer
# um deck em vez de uma lista de texto.
png = "0.18.1"

[dev-dependencies]
minisign-verify = "0.2.5"
# `io-util` só é usado pela API de mentira que prova a sessão persistente.
tokio = { version = "1", features = ["io-util"] }

[target.'cfg(windows)'.dependencies]
# DPAPI, para proteger a chave privada em repouso.
#
# A proteção fica atrelada à conta de usuário do Windows: copiar o arquivo para
# outra máquina, ou abri-lo com outro usuário, não devolve a chave.
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    # Extração do ícone do executável: o Shell entrega o `HICON`, o GDI dá
    # acesso aos pixels dele e `WindowsAndMessaging` traz `GetIconInfo` e o
    # `DestroyIcon` que evita vazar handle a cada atalho cadastrado.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # `SHGetFileInfoW` recebe um `FILE_FLAGS_AND_ATTRIBUTES`, que mora aqui —
    # sem esta feature a própria função não é exposta pelo crate.
    "Win32_Storage_FileSystem",
    # Programa em primeiro plano: `GetForegroundWindow` dá a janela e
    # `WindowsAndMessaging` o dono dela, mas `OpenProcess` e
    # `QueryFullProcessImageNameW` — que traduzem o processo em nome de
    # arquivo — moram aqui.
    "Win32_System_Threading",
    # Energia remota (ADR-0006).
    #
    # `Power` traz `GetPwrCapabilities` — a leitura de quais estados esta
    # máquina suporta de verdade — e `SetSuspendState`. `Shutdown` traz
    # `LockWorkStation`, `InitiateSystemShutdownExW` e `AbortSystemShutdownW`.
    "Win32_System_Power",
    "Win32_System_Shutdown",
    # Desligar exige habilitar `SeShutdownPrivilege` no token do processo: ele
    # existe em todo usuário interativo, mas nasce desabilitado, e sem
    # `AdjustTokenPrivileges` o desligamento falha com acesso negado.
    "Win32_Security",
    # O adaptador de rede ativo e o endereço físico dele, para o pacote mágico.
    # `Ndis` traz `IfOperStatusUp` e `WinSock` o `SOCKADDR_IN` de onde sai o
    # IPv4 que dá o broadcast da sub-rede.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Instalador pequeno importa num agente que fica sempre residente.
opt-level = "s"
# LTO fino, e não `true` (que é o LTO gordo).
#
# O gordo religa o programa inteiro num único passo no fim da compilação. Esse
# passo não é cacheável: rodava por completo em toda publicação, mesmo sem uma
# linha de Rust ter mudado, e era o que sobrava depois de o cache resolver o
# resto. O fino faz a otimização entre módulos em paralelo, entrega quase o
# mesmo tamanho e devolve minutos a cada release.
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
