[package]
name = "slate-agente"
version = "0.1.5"
description = "Agente do SLATE para Windows"
authors = ["Aionixdev"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "slate_agente_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cliente HTTP com armazenamento de cookies próprio do processo.
#
# O Agente autentica na conta como qualquer cliente, mas não é um navegador: o
# cookie de sessão vive aqui, fora do alcance da interface. Isso evita toda a
# discussão de origem e SameSite que existe do lado da PWA.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "rustls-tls",
] }

# O armazenamento de cookies embutido no reqwest só existe em memória: fechar o
# Agente apagava a sessão e obrigava a entrar de novo a cada abertura. Estes
# dois pacotes expõem o mesmo armazenamento em forma serializável, que o
# `api.rs` grava em disco protegido por DPAPI.
#
# A versão está presa em 0.9 de propósito: a 0.10 implementa o trait de cookies
# do reqwest 0.13, e com o reqwest 0.12 daqui o `cookie_provider` não compila.
# Subir uma exige subir a outra.
reqwest_cookie_store = "0.9"
cookie_store = { version = "0.22", features = ["serde_json"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

# Transporte em tempo real. `webrtc` fornece a pilha completa (ICE, TURN,
# DTLS, SCTP e DataChannel); usar `str0m` exigiria implementar descoberta de
# interfaces e TURN fora da biblioteca, justamente as partes críticas do P1-M5.
webrtc = "0.20.2"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
local-ip-address = "0.6.13"
uuid = { version = "1", features = ["v4", "serde"] }

# Identidade do dispositivo.
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
base64 = "0.22"

thiserror = "2"

[dev-dependencies]
minisign-verify = "0.2.5"
# `io-util` só é usado pela API de mentira que prova a sessão persistente.
tokio = { version = "1", features = ["io-util"] }

[target.'cfg(windows)'.dependencies]
# DPAPI, para proteger a chave privada em repouso.
#
# A proteção fica atrelada à conta de usuário do Windows: copiar o arquivo para
# outra máquina, ou abri-lo com outro usuário, não devolve a chave.
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Instalador pequeno importa num agente que fica sempre residente.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
