name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Um push novo cancela a verificação do anterior no mesmo branch: o resultado
  # do commit antigo deixou de importar no instante em que veio o próximo.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.20.0"

jobs:
  qualidade:
    name: Tipos e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checagem de tipos
        run: pnpm -r typecheck

      - name: Testes unitários
        # Sem DATABASE_URL, as suítes que precisam de banco se pulam sozinhas
        # em vez de falhar — quem não tem acesso ao banco ainda consegue rodar
        # o resto.
        run: >
          pnpm --filter @slate/db
          --filter @slate/protocol
          --filter @slate/design-system
          --filter @slate/identidade
          --filter @slate/api
          --filter @slate/control-center
          --filter @slate/pwa
          --filter @slate/desktop
          test

      - name: Build do Centro de Controle
        run: pnpm --filter @slate/control-center exec next build

  agente:
    name: Agente Windows — Rust e atualizador
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Este job é o produtor do cache de compilação do Agente; a publicação de
      # release apenas consome (ver `release-desktop.yml`).
      #
      # A inversão é imposta pelo GitHub: cache criado numa tag só é visível
      # para aquela tag, então uma release nunca aproveitaria o cache da
      # anterior. Cache do branch padrão, por outro lado, é visível de
      # qualquer ref — daí `shared-key` igual nos dois lados e gravação só
      # aqui, no `main`.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: agente-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Interface do Agente
        run: |
          pnpm --filter @slate/desktop typecheck
          pnpm --filter @slate/desktop test

      # `tauri::generate_context!` lê a configuração em tempo de compilação e
      # exige que `frontendDist` exista — mesmo para `cargo test`, que não abre
      # janela nenhuma. Como `apps/desktop/dist/` não é versionado, sem este
      # passo o Rust falha aqui e passa na máquina de quem já rodou o build.
      - name: Interface compilada para o contexto do Tauri
        run: pnpm --filter @slate/desktop build

      - name: Agente nativo e assinatura de atualização
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      # `cargo test` compila em `debug`; o instalador é compilado em `release`,
      # com `opt-level="s"` e `codegen-units=1`. São artefatos diferentes, e um
      # cache só com os de `debug` não encurtaria nada na hora de publicar —
      # que é justamente o momento em que alguém está esperando.
      #
      # Custa poucos minutos aqui, onde ninguém espera, para tirar oito da
      # publicação. Não empacota nem assina: só aquece as dependências.
      - name: Aquecer as dependências de release
        if: github.ref == 'refs/heads/main'
        run: cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Só roda quando o segredo existe. Um job que falha por falta de
    # configuração treina todo mundo a ignorar CI vermelho.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar se o banco de homologação está configurado
        id: verificar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL_STAGING não configurado; testes de integração pulados."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      # Sem isto, uma migração nova torna a suíte vermelha por estado do banco e
      # não por defeito no código — foi o que aconteceu com a tabela de convites
      # por QR, que existia no schema e não em homologação.
      - name: Migrar o banco de homologação
        if: steps.verificar.outputs.configurado == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: pnpm --filter @slate/db exec tsx src/migrate.ts

      - name: Testes de integração
        if: steps.verificar.outputs.configurado == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        # A API e a CLI têm suítes que só rodam com banco; sem ele elas se
        # pulam sozinhas em vez de falhar.
        run: pnpm --filter @slate/roadmap-cli --filter @slate/api test

  pwa:
    name: PWA — instalabilidade e offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: qualidade

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores
        # WebKit entra porque é o motor do iPad e do iPhone, onde as
        # limitações de PWA são maiores. Testar só em Chromium deixaria de
        # fora justamente a plataforma mais restritiva.
        run: pnpm --filter @slate/pwa exec playwright install chromium webkit --with-deps

      - name: Subir a PWA
        run: |
          pnpm --filter @slate/pwa exec next build
          pnpm --filter @slate/pwa exec next start -p 4400 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4400/manifest.webmanifest > /dev/null; then
              echo "no ar após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::A PWA não respondeu em 60s"
          exit 1

      - name: Testes de instalabilidade
        env:
          E2E_BASE_URL: http://localhost:4400
        run: pnpm --filter @slate/pwa exec playwright test

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: apps/pwa/playwright-report/
          retention-days: 7

  e2e:
    name: Centro de Controle — ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: qualidade

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar se o banco de homologação está configurado
        id: verificar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL_STAGING não configurado; testes ponta a ponta pulados."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar o banco de homologação
        if: steps.verificar.outputs.configurado == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        # Os testes verificam que o conteúdo real do plano aparece na tela, o
        # que só é determinístico se o banco estiver num estado conhecido. Sem
        # este passo, a suíte falha quando homologação fica para trás — foi
        # exatamente o que aconteceu: o plano foi traduzido em produção e
        # homologação continuou em inglês. A carga é aditiva e não rebobina
        # status já avançado.
        run: |
          pnpm --filter @slate/db exec tsx src/migrate.ts
          pnpm --filter @slate/db exec tsx src/seed.ts

      - name: Instalar navegador
        if: steps.verificar.outputs.configurado == 'true'
        run: pnpm --filter @slate/control-center exec playwright install chromium --with-deps

      - name: Subir o Centro de Controle
        if: steps.verificar.outputs.configurado == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          pnpm --filter @slate/control-center exec next build
          pnpm --filter @slate/control-center exec next start -p 4300 &
          # Espera o serviço responder de fato, em vez de dormir um tempo fixo
          # e torcer para ter dado.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4300/api/health > /dev/null; then
              echo "no ar após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::O Centro de Controle não respondeu em 60s"
          exit 1

      - name: Testes ponta a ponta
        if: steps.verificar.outputs.configurado == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          E2E_BASE_URL: http://localhost:4300
        run: pnpm --filter @slate/control-center exec playwright test

      - name: Guardar o relatório quando falhar
        if: failure() && steps.verificar.outputs.configurado == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/control-center/playwright-report/
          retention-days: 7
